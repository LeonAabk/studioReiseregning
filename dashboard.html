<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedriftsportal — Reiseregning</title>
    <meta name="description" content="Bedriftsportal for godkjenning, attestasjon og utbetaling av reiseregninger.">
    <meta property="og:title" content="Bedriftsportal — Reiseregning">
    <meta property="og:description" content="Bedriftsportal for godkjenning, attestasjon og utbetaling av reiseregninger.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="ui-utils.js"></script>
    <style>
        .dashboard-container { max-width: 1140px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 18px; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
        .dashboard-header h1 { margin: 0; font-size: 1.7rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 20px 22px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); transition: all var(--transition-speed); }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-card h4 { margin: 0 0 8px 0; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .stat-card .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin: 0; font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        .join-code-badge { background: var(--bg-color); padding: 6px 12px; border-radius: var(--radius-md); font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; border: 1px dashed var(--border-strong); display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-primary); }
        .data-section { background: white; padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); margin-bottom: 24px; }
        .data-section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
        .data-section-header h3 { margin: 0; }
        .data-table-container { overflow-x: auto; border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .data-table { width: 100%; border-collapse: collapse; min-width: 720px; }
        .data-table th, .data-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background: #f8fafc; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 0.76rem; letter-spacing: 0.04em; }
        .data-table tbody tr:hover { background: #f8fafc; }
        .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
        .filter-tabs { display: inline-flex; background: var(--bg-color); border: 1px solid var(--border-color); padding: 4px; border-radius: var(--radius-md); gap: 4px; }
        .filter-tab { background: transparent; border: none; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); transition: all var(--transition-speed); }
        .filter-tab.active { background: white; color: var(--accent-color); box-shadow: var(--shadow-xs); }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 3-Zone Top Bar Contract -->
        <header class="main-header" style="margin-bottom: 24px;">
            <div class="brand-zone">
                <a href="index.html" class="brand-link">
                    Reiseregning
                </a>
                <span class="brand-badge" style="background: #f1f5f9; color: #475569; border-color: #cbd5e1;">Bedriftsportal</span>
            </div>

            <nav class="nav-links-zone">
                <a href="index.html" class="nav-link">&larr; Tilbake til reiseregning</a>
                <button type="button" class="nav-link active" onclick="location.reload()">Oversikt</button>
            </nav>

            <div class="header-actions">
                <a href="index.html" class="btn btn-primary btn-small">+ Ny reiseregning</a>
            </div>
        </header>

        <div id="dashboard-app">
            <!-- Dashboard innhold injiseres her -->
        </div>
    </div>

    <!-- Read-Only Invoice Modal -->
    <div class="modal-overlay" id="report-modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="report-modal-title">Reiseregning Detaljer</h2>
                <button class="btn btn-outline btn-small" id="btn-close-report-modal">Lukk</button>
            </div>
            <div class="modal-body" id="report-modal-body">
                <!-- Dynamisk faktura HTML injiseres her -->
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
